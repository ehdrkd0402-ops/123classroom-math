<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나눗셈 방탈출: 수학 수호대</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 사용자가 제공한 Firebase 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyAXIAIU3y_hTt2jI2qsw-3prAn3UH-wTR4",
            authDomain: "classroom-math.firebaseapp.com",
            projectId: "classroom-math",
            storageBucket: "classroom-math.firebasestorage.app",
            messagingSenderId: "69499715644",
            appId: "1:69499715644:web:097dc0a3cb731cb5030339",
            measurementId: "G-KYLRYWPCZY"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            window.gameDB = { db, auth, collection, addDoc, onSnapshot, query, serverTimestamp };

            // 인증 상태 감시 및 익명 로그인 시도
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    console.log("Firebase 인증 성공:", user.uid);
                    window.firebaseReady = true;
                    window.firebaseError = false;
                } else {
                    signInAnonymously(auth).catch(err => {
                        console.error("인증 실패 (익명 로그인 활성화 필요):", err);
                        window.firebaseError = true;
                    });
                }
            });
        } catch (e) {
            console.error("초기화 오류:", e);
            window.firebaseError = true;
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { 
            font-family: 'Jua', sans-serif; 
            background-color: #1a202c; 
            color: white; 
            overflow: hidden; 
            touch-action: none; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-canvas { 
            background-color: #2d3748; 
            border: 4px solid #4a5568; 
            border-radius: 1.5rem; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 95vw;
            max-height: 70vh;
        }
        .modal { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); }
        .key-btn { 
            width: 64px; 
            height: 64px; 
            background: #4a5568; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 16px; 
            font-size: 28px; 
            cursor: pointer; 
            user-select: none; 
            box-shadow: 0 4px 0 #2d3748; 
            transition: all 0.1s;
        }
        .key-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2d3748; background: #718096; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>

    <!-- 상단 UI -->
    <div id="ui-layer" class="w-full max-w-lg mb-4 flex justify-between items-end px-4">
        <div>
            <div class="text-xs text-blue-300 font-bold mb-1">STAGE <span id="stage-display">1</span></div>
            <div class="text-2xl font-bold text-yellow-400">SCORE: <span id="score-display">0</span></div>
        </div>
        <div class="flex flex-col items-center">
            <div id="lives-display" class="text-xl tracking-widest mb-1">❤️❤️❤️❤️❤️</div>
            <div class="w-32 bg-gray-700 h-3 rounded-full overflow-hidden border border-gray-600">
                <div id="timer-bar" class="bg-gradient-to-r from-red-500 to-orange-400 h-full transition-all duration-1000" style="width: 100%"></div>
            </div>
        </div>
        <div class="text-right">
            <div class="text-xs text-orange-300 font-bold mb-1">BOX: <span id="box-count-display">0</span></div>
            <div class="text-2xl font-bold text-red-400">TIME: <span id="timer-text">60</span></div>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <!-- 모바일 컨트롤러 -->
    <div class="mt-6 grid grid-cols-3 gap-3 md:hidden">
        <div></div><button class="key-btn" onmousedown="startContinuousMove('up')" onmouseup="stopContinuousMove()" ontouchstart="startContinuousMove('up')" ontouchend="stopContinuousMove()">↑</button><div></div>
        <button class="key-btn" onmousedown="startContinuousMove('left')" onmouseup="stopContinuousMove()" ontouchstart="startContinuousMove('left')" ontouchend="stopContinuousMove()">←</button>
        <button class="key-btn" onmousedown="startContinuousMove('down')" onmouseup="stopContinuousMove()" ontouchstart="startContinuousMove('down')" ontouchend="stopContinuousMove()">↓</button>
        <button class="key-btn" onmousedown="startContinuousMove('right')" onmouseup="stopContinuousMove()" ontouchstart="startContinuousMove('right')" ontouchend="stopContinuousMove()">→</button>
    </div>

    <!-- 메인 화면 -->
    <div id="start-modal" class="fixed inset-0 modal flex items-center justify-center z-50">
        <div class="bg-white text-gray-800 p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl mx-4">
            <div class="text-5xl mb-4 text-blue-600">🏃🚪</div>
            <h1 class="text-4xl text-blue-600 mb-2 font-bold">나눗셈 방탈출</h1>
            <p class="mb-6 text-gray-500 text-sm">익명 로그인이 활성화되어야<br>랭킹 기록이 가능합니다!</p>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="initGame(1)" class="bg-orange-400 text-white p-3 rounded-xl font-bold hover:bg-orange-500 shadow-md transition">1단계: (두·세 자리) ÷ (몇십)</button>
                <button onclick="initGame(2)" class="bg-green-400 text-white p-3 rounded-xl font-bold hover:bg-green-500 shadow-md transition">2단계: (두 자리) ÷ (몇십몇)</button>
                <button onclick="initGame(3)" class="bg-blue-400 text-white p-3 rounded-xl font-bold hover:bg-blue-500 shadow-md transition">3단계: (세 자리) ÷ (몇십몇) - 몫 1자리</button>
                <button onclick="initGame(4)" class="bg-purple-400 text-white p-3 rounded-xl font-bold hover:bg-purple-500 shadow-md transition">4단계: (세 자리) ÷ (몇십몇) - 몫 2자리</button>
            </div>
            <button onclick="showRanking()" class="mt-5 w-full border-2 border-blue-100 p-3 rounded-xl text-blue-600 font-bold hover:bg-blue-50 transition">
                🏆 명예의 전당 보기
            </button>
        </div>
    </div>

    <!-- 랭킹 화면 -->
    <div id="ranking-modal" class="fixed inset-0 modal hidden flex items-center justify-center z-[60]">
        <div class="bg-white text-gray-800 p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl mx-4">
            <h2 class="text-2xl font-bold text-yellow-600 mb-4">🏆 명예의 전당 (Top 10)</h2>
            <div id="ranking-list" class="space-y-2 mb-6 max-h-80 overflow-y-auto pr-2 text-sm border-t border-b py-4">
                <p class="text-gray-400 py-10">데이터를 불러오는 중...</p>
            </div>
            <button onclick="document.getElementById('ranking-modal').classList.add('hidden')" class="w-full bg-gray-700 text-white p-3 rounded-xl font-bold">닫기</button>
        </div>
    </div>

    <!-- 퀴즈 화면 -->
    <div id="quiz-modal" class="fixed inset-0 modal hidden flex items-center justify-center z-40">
        <div class="bg-white text-gray-800 p-8 rounded-3xl max-w-[320px] w-full text-center shadow-2xl mx-4 border-4 border-blue-500">
            <div id="quiz-topic" class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full mb-4 inline-block font-bold">나눗셈 미션</div>
            <div class="text-5xl mb-8 font-bold text-gray-800"><span id="q-n1">0</span> ÷ <span id="q-n2">0</span></div>
            <div class="space-y-4">
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold">몫</span>
                    <input type="number" id="ans-q" class="w-full border-2 border-gray-200 p-4 pl-12 rounded-2xl text-2xl text-center outline-none focus:border-blue-500 transition">
                </div>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold">나</span>
                    <input type="number" id="ans-r" class="w-full border-2 border-gray-200 p-4 pl-12 rounded-2xl text-2xl text-center outline-none focus:border-blue-500 transition">
                </div>
                <button onclick="submitAnswer()" class="w-full bg-blue-600 text-white p-4 rounded-2xl text-2xl font-bold shadow-lg active:scale-95 transition">정답 제출</button>
            </div>
            <p id="quiz-feedback" class="mt-4 font-bold text-red-500 h-6"></p>
        </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-modal" class="fixed inset-0 modal hidden flex items-center justify-center z-50">
        <div class="bg-white text-gray-800 p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl mx-4">
            <h2 class="text-4xl font-bold text-blue-600 mb-2">게임 종료</h2>
            <p id="result-msg" class="text-gray-500 mb-6 font-bold"></p>
            <div class="bg-blue-50 p-6 rounded-3xl mb-8 border-2 border-blue-100">
                <p class="text-sm text-blue-400 font-bold mb-1">나의 점수</p>
                <p id="final-score" class="text-7xl font-bold text-blue-600">0</p>
            </div>
            <div id="rank-save-area" class="mb-6 p-4 border-4 border-dotted border-blue-100 rounded-3xl">
                <input type="text" id="player-name" maxlength="8" placeholder="닉네임을 입력하세요" class="w-full border-2 border-gray-100 p-4 rounded-xl text-center font-bold mb-4 outline-none focus:border-green-500 transition">
                <button onclick="saveToRanking()" id="save-btn" class="w-full bg-green-500 text-white p-4 rounded-xl text-xl font-bold hover:bg-green-600 shadow-lg active:scale-95 transition">랭킹에 등록</button>
                <p id="save-msg" class="text-[11px] mt-3 text-gray-400 font-bold"></p>
            </div>
            <button onclick="location.reload()" class="w-full bg-gray-100 text-gray-500 p-4 rounded-xl font-bold">홈으로 가기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const TILE_SIZE = 40; const GRID_SIZE = 10;
        canvas.width = TILE_SIZE * GRID_SIZE; canvas.height = TILE_SIZE * GRID_SIZE;

        let player = { x: 1, y: 1 }; let exit = { x: 8, y: 8 };
        let boxes = []; let map = []; let score = 0; let lives = 5;
        let timeLeft = 60; let currentTopic = 1; let stage = 1;
        let timerId = null; let hasKey = false; let quizData = {};
        let moveInterval = null; let isPaused = false; let selectedBoxIndex = -1;

        const topicNames = { 
            1: "(두·세 자리) ÷ (몇십)", 
            2: "(두 자리) ÷ (몇십몇)", 
            3: "(세 자리) ÷ (몇십몇) [몫 1자리]", 
            4: "(세 자리) ÷ (몇십몇) [몫 2자리]" 
        };

        function generateMap() {
            map = [];
            for(let y=0; y<GRID_SIZE; y++) {
                map[y] = [];
                for(let x=0; x<GRID_SIZE; x++) {
                    map[y][x] = (x === 0 || y === 0 || x === GRID_SIZE-1 || y === GRID_SIZE-1) ? 1 : (Math.random() < 0.12 ? 1 : 0);
                }
            }
            player = { x: 1, y: 1 }; exit = { x: 8, y: 8 }; map[1][1] = 0; map[8][8] = 0;
            boxes = [];
            let boxCount = 2 + Math.min(stage, 5);
            for (let i = 0; i < boxCount; i++) {
                let bx, by;
                do { bx = Math.floor(Math.random()*8)+1; by = Math.floor(Math.random()*8)+1; } 
                while (map[by][bx] === 1 || (bx === 1 && by === 1) || (bx === 8 && by === 8) || boxes.some(b => b.x === bx && b.y === by));
                boxes.push({ x: bx, y: by, solved: false });
            }
            hasKey = false; updateUI();
        }

        function updateUI() {
            document.getElementById('stage-display').innerText = stage;
            document.getElementById('score-display').innerText = score;
            const remaining = boxes.filter(b => !b.solved).length;
            document.getElementById('box-count-display').innerText = remaining;
            if (remaining === 0) hasKey = true;
            document.getElementById('lives-display').innerText = "❤️".repeat(Math.max(0, lives)) + "🤍".repeat(Math.max(0, 5-lives));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#34495e'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let y=0; y<GRID_SIZE; y++) {
                for(let x=0; x<GRID_SIZE; x++) {
                    if(map[y][x] === 1) { 
                        ctx.fillStyle = '#4a5568'; 
                        ctx.beginPath();
                        ctx.roundRect(x*TILE_SIZE+1, y*TILE_SIZE+1, TILE_SIZE-2, TILE_SIZE-2, 6);
                        ctx.fill();
                    }
                }
            }
            ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(hasKey ? '🔓' : '🔒', exit.x*TILE_SIZE + 20, exit.y*TILE_SIZE + 20);
            boxes.forEach(b => { if(!b.solved) ctx.fillText('📦', b.x*TILE_SIZE+20, b.y*TILE_SIZE+20); });
            ctx.fillText('🏃', player.x*TILE_SIZE+20, player.y*TILE_SIZE+20);
        }

        function processMove(dir) {
            if(isPaused) return;
            let nx = player.x, ny = player.y;
            if(dir === 'up') ny--; if(dir === 'down') ny++; if(dir === 'left') nx--; if(dir === 'right') nx++;
            if(nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && map[ny][nx] === 0) {
                player.x = nx; player.y = ny;
                const idx = boxes.findIndex(b => !b.solved && b.x === nx && b.y === ny);
                if(idx !== -1) { selectedBoxIndex = idx; openQuiz(); }
                if(hasKey && nx === exit.x && ny === exit.y) { stage++; score += 100; timeLeft += 20; generateMap(); }
                draw();
            }
        }

        function openQuiz() {
            stopContinuousMove(); isPaused = true;
            let n1, n2;
            if(currentTopic === 1) { n2 = (Math.floor(Math.random()*9)+1)*10; n1 = n2 * (Math.floor(Math.random()*8)+2) + Math.floor(Math.random()*(n2-1)); }
            else if(currentTopic === 2) { n2 = Math.floor(Math.random()*80)+11; let q = Math.floor(Math.random()*3)+1; n1 = n2 * q + Math.floor(Math.random()*Math.min(n2, 10)); if(n1 > 99) n1 = 99; }
            else if(currentTopic === 3) { n2 = Math.floor(Math.random()*80)+11; n1 = n2 * (Math.floor(Math.random()*9)+1) + Math.floor(Math.random()*(n2-1)); if(n1 < 100) n1 += 100; if(n1 > 999) n1 = 999; }
            else { n2 = Math.floor(Math.random()*40)+11; n1 = n2 * (Math.floor(Math.random()*20)+10) + Math.floor(Math.random()*(n2-1)); if(n1 > 999) n1 = 999; }
            
            quizData = { n1, n2, q: Math.floor(n1/n2), r: n1%n2 };
            document.getElementById('q-n1').innerText = n1; document.getElementById('q-n2').innerText = n2;
            document.getElementById('ans-q').value = ''; document.getElementById('ans-r').value = '';
            document.getElementById('quiz-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('ans-q').focus(), 100);
        }

        function submitAnswer() {
            const uq = parseInt(document.getElementById('ans-q').value);
            const ur = parseInt(document.getElementById('ans-r').value || 0);
            if(uq === quizData.q && ur === quizData.r) {
                boxes[selectedBoxIndex].solved = true; score += (20 * stage); isPaused = false;
                document.getElementById('quiz-modal').classList.add('hidden');
                updateUI(); draw();
            } else {
                lives--; updateUI();
                document.getElementById('quiz-feedback').innerText = `오답! 정답: ${quizData.q} ... ${quizData.r}`;
                if(lives <= 0) endGame("목숨을 모두 잃었습니다.");
                else setTimeout(() => { isPaused = false; document.getElementById('quiz-modal').classList.add('hidden'); document.getElementById('quiz-feedback').innerText = ""; draw(); }, 1800);
            }
        }

        function initGame(topic) {
            currentTopic = topic; score = 0; stage = 1; lives = 5; 
            const baseTime = (topic === 4 ? 150 : 80);
            timeLeft = baseTime; isPaused = false; 
            document.getElementById('start-modal').classList.add('hidden');
            generateMap(); draw();
            if(timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                if(isPaused) return;
                timeLeft--; document.getElementById('timer-text').innerText = Math.max(0, timeLeft);
                document.getElementById('timer-bar').style.width = (timeLeft / baseTime * 100) + "%";
                if(timeLeft <= 0) endGame("시간 초과!");
            }, 1000);
        }

        function endGame(msg) { clearInterval(timerId); isPaused = true; document.getElementById('result-modal').classList.remove('hidden'); document.getElementById('result-msg').innerText = msg; document.getElementById('final-score').innerText = score; }

        async function saveToRanking() {
            const name = document.getElementById('player-name').value.trim();
            const msg = document.getElementById('save-msg');
            const btn = document.getElementById('save-btn');
            if(!name) { msg.innerText = "이름을 입력하세요!"; return; }
            if(!window.firebaseReady) { alert("서버 연결 중입니다. 익명 로그인이 활성화되었는지 확인하세요."); return; }
            btn.disabled = true; btn.innerText = "저장 중...";
            try {
                const { db, collection, addDoc, serverTimestamp } = window.gameDB;
                await addDoc(collection(db, 'rankings'), { name, score, topic: topicNames[currentTopic], createdAt: serverTimestamp() });
                document.getElementById('rank-save-area').innerHTML = "<p class='text-green-600 font-bold text-xl py-6'>기록 등록 완료!</p>";
                setTimeout(showRanking, 1000);
            } catch(e) { console.error(e); btn.disabled = false; btn.innerText = "다시 시도"; msg.innerText = "저장 오류 발생"; }
        }

        function showRanking() {
            document.getElementById('ranking-modal').classList.remove('hidden');
            const list = document.getElementById('ranking-list');
            if (window.firebaseError || !window.gameDB) { list.innerHTML = "<p class='text-red-500 py-10'>익명 로그인을 활성화해야 합니다.</p>"; return; }
            list.innerHTML = "불러오는 중...";
            try {
                const { db, collection, onSnapshot, query } = window.gameDB;
                onSnapshot(query(collection(db, 'rankings')), (snap) => {
                    let data = []; snap.forEach(d => data.push(d.data()));
                    data.sort((a,b) => b.score - a.score); data = data.slice(0, 10);
                    if(data.length === 0) { list.innerHTML = "<p class='py-10 text-gray-400'>기록이 없습니다.</p>"; return; }
                    list.innerHTML = data.map((r, i) => `
                        <div class="flex justify-between items-center p-3 border-b border-gray-50 bg-gray-50/50 rounded-lg mb-1">
                            <div class="flex items-center gap-3 text-left">
                                <span class="font-bold text-lg ${i < 3 ? 'text-yellow-500' : 'text-blue-300'} w-6">${i+1}</span>
                                <div><div class="font-bold text-gray-800 text-base">${r.name}</div><div class="text-[10px] text-gray-400 font-bold">${r.topic}</div></div>
                            </div>
                            <div class="font-bold text-blue-600 text-lg">${r.score}</div>
                        </div>`).join('');
                }, (error) => { list.innerHTML = "<p class='text-red-400 py-10'>데이터를 불러올 수 없습니다.</p>"; });
            } catch(e) { list.innerHTML = "연결 실패."; }
        }

        function startContinuousMove(dir) { if(!isPaused) { processMove(dir); moveInterval = setInterval(() => processMove(dir), 150); } }
        function stopContinuousMove() { clearInterval(moveInterval); }
        window.addEventListener('keydown', e => { if(isPaused) return; if(e.key.includes('Arrow')) processMove(e.key.replace('Arrow','').toLowerCase()); });
    </script>
</body>
</html>
