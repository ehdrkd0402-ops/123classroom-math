<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나눗셈 방탈출: 수학 수호대</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, addDoc, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXIAIU3y_hTt2jI2qsw-3prAn3UH-wTR4",
            authDomain: "classroom-math.firebaseapp.com",
            projectId: "classroom-math",
            storageBucket: "classroom-math.firebasestorage.app",
            messagingSenderId: "69499715644",
            appId: "1:69499715644:web:097dc0a3cb731cb5030339",
            measurementId: "G-KYLRYWPCZY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        window.gameDB = { db, auth, collection, addDoc, onSnapshot, query, orderBy, limit };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                console.log("인증 완료");
            } else {
                signInAnonymously(auth).catch(err => console.error("로그인 실패:", err));
            }
        });

        window.showRanking = function() {
            if (!auth.currentUser) {
                alert("서버 연결 중입니다. 1~2초 후 다시 눌러주세요!");
                return;
            }
            document.getElementById('ranking-modal').classList.remove('hidden');
            const list = document.getElementById('ranking-list');
            list.innerHTML = "<p class='text-gray-400 p-4'>랭킹 로딩 중...</p>";
            
            const q = query(collection(db, 'escape_rankings'), orderBy("score", "desc"), limit(10));
            onSnapshot(q, (snap) => {
                let html = "";
                let i = 1;
                snap.forEach(doc => {
                    const r = doc.data();
                    html += `<div class="flex justify-between items-center border-b p-3">
                        <span class="font-bold text-blue-600">${i}. ${r.name}</span>
                        <div class="text-right">
                            <div class="text-[10px] text-gray-400">${r.topic}</div>
                            <div class="font-bold">${r.score}점</div>
                        </div>
                    </div>`;
                    i++;
                });
                list.innerHTML = html || "<p class='text-gray-400 p-4'>아직 기록이 없습니다.</p>";
            }, (err) => {
                list.innerHTML = "<p class='text-red-400 p-4'>데이터를 불러올 수 없습니다.</p>";
            });
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { 
            font-family: 'Jua', sans-serif; 
            background-color: #1a202c; 
            color: white; 
            overflow: hidden; 
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-canvas { 
            background-color: #2d3748; 
            border: 4px solid #4a5568; 
            border-radius: 1rem; 
            display: block; 
            margin: 0 auto;
            max-width: 95vw;
            max-height: 50vh;
        }
        .modal { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); }
        /* 컨트롤러 스타일 개선 */
        .ctrl-btn {
            width: 70px;
            height: 70px;
            background: #4a5568;
            border-bottom: 4px solid #2d3748;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-size: 30px;
            cursor: pointer;
            active:translate-y-1;
            active:border-b-0;
        }
        .ctrl-btn:active {
            background: #718096;
            transform: translateY(2px);
            border-bottom-width: 0;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen pt-4 overflow-hidden">

    <!-- 상단 정보 UI -->
    <div id="ui-layer" class="w-full max-w-md mb-2 flex justify-between items-center px-4">
        <div class="text-left">
            <div class="text-xs text-blue-300">STAGE <span id="stage-display">1</span></div>
            <div class="text-xl font-bold text-yellow-400"><span id="score-display">0</span></div>
        </div>
        <div class="flex flex-col items-center">
            <div id="lives-display" class="text-lg">❤️❤️❤️❤️❤️</div>
            <div class="w-24 bg-gray-700 h-1.5 rounded-full mt-1 overflow-hidden">
                <div id="timer-bar" class="bg-red-500 h-full transition-all duration-1000" style="width: 100%"></div>
            </div>
        </div>
        <div class="text-right">
            <div class="text-xs text-orange-300">BOX: <span id="box-count-display">0</span></div>
            <div id="timer-text" class="text-xl font-bold text-red-400">60</div>
        </div>
    </div>

    <!-- 게임 화면 -->
    <canvas id="game-canvas"></canvas>

    <!-- 태블릿용 가상 방향키 -->
    <div class="mt-4 grid grid-cols-3 gap-3 p-4 bg-gray-800/50 rounded-3xl">
        <div></div>
        <button class="ctrl-btn" onmousedown="startContinuousMove('up')" onmouseup="stopContinuousMove()" onmouseleave="stopContinuousMove()" ontouchstart="event.preventDefault(); startContinuousMove('up')" ontouchend="stopContinuousMove()">↑</button>
        <div></div>
        <button class="ctrl-btn" onmousedown="startContinuousMove('left')" onmouseup="stopContinuousMove()" onmouseleave="stopContinuousMove()" ontouchstart="event.preventDefault(); startContinuousMove('left')" ontouchend="stopContinuousMove()">←</button>
        <button class="ctrl-btn" onmousedown="startContinuousMove('down')" onmouseup="stopContinuousMove()" onmouseleave="stopContinuousMove()" ontouchstart="event.preventDefault(); startContinuousMove('down')" ontouchend="stopContinuousMove()">↓</button>
        <button class="ctrl-btn" onmousedown="startContinuousMove('right')" onmouseup="stopContinuousMove()" onmouseleave="stopContinuousMove()" ontouchstart="event.preventDefault(); startContinuousMove('right')" ontouchend="stopContinuousMove()">→</button>
    </div>

    <!-- 시작 모달 -->
    <div id="start-modal" class="fixed inset-0 modal flex items-center justify-center z-50 p-4">
        <div class="bg-white text-gray-800 p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl">
            <h1 class="text-3xl text-blue-600 mb-1 font-bold italic">나눗셈 방탈출</h1>
            <p class="mb-6 text-gray-500 text-sm">상자를 모두 열고 탈출구(🔓)로 가세요!</p>
            <div class="grid grid-cols-1 gap-2">
                <button onclick="initGame(1)" class="bg-orange-400 text-white p-3 rounded-xl font-bold text-lg active:scale-95 transition-transform">1단계: ÷ 몇십</button>
                <button onclick="initGame(2)" class="bg-green-400 text-white p-3 rounded-xl font-bold text-lg active:scale-95 transition-transform">2단계: ÷ 몇십몇</button>
                <button onclick="initGame(3)" class="bg-blue-400 text-white p-3 rounded-xl font-bold text-lg active:scale-95 transition-transform">3단계: 세 자리 ÷ 몇십몇 (몫 1자)</button>
                <button onclick="initGame(4)" class="bg-purple-400 text-white p-3 rounded-xl font-bold text-lg active:scale-95 transition-transform">4단계: 세 자리 ÷ 몇십몇 (몫 2자)</button>
            </div>
            <button onclick="showRanking()" class="mt-4 w-full border-2 border-gray-300 p-2 rounded-xl text-gray-600 font-bold">🏆 명예의 전당</button>
        </div>
    </div>

    <!-- 퀴즈 모달 -->
    <div id="quiz-modal" class="fixed inset-0 modal hidden flex items-center justify-center z-40 p-4">
        <div class="bg-white text-gray-800 p-6 rounded-3xl max-w-xs w-full text-center shadow-2xl">
            <div id="quiz-topic" class="text-[10px] bg-blue-100 text-blue-700 px-3 py-1 rounded-full mb-3 inline-block font-bold"></div>
            <div class="text-4xl mb-4 font-bold text-gray-800"><span id="q-n1">0</span> ÷ <span id="q-n2">0</span></div>
            <div class="space-y-3">
                <div class="flex items-center gap-2">
                    <span class="w-12 text-gray-400 font-bold text-sm text-right">몫</span>
                    <input type="number" id="ans-q" placeholder="입력" class="w-full border-2 p-3 rounded-xl text-xl text-center outline-none focus:border-blue-500">
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-12 text-gray-400 font-bold text-sm text-right">나머지</span>
                    <input type="number" id="ans-r" placeholder="0" class="w-full border-2 p-3 rounded-xl text-xl text-center outline-none focus:border-blue-500">
                </div>
            </div>
            <button onclick="submitAnswer()" class="w-full bg-blue-600 text-white p-4 rounded-xl text-xl font-bold mt-5 active:scale-95 transition-transform">정답 확인</button>
            <p id="quiz-feedback" class="mt-3 font-bold text-red-500 h-5 text-sm"></p>
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="result-modal" class="fixed inset-0 modal hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white text-gray-800 p-6 rounded-3xl max-w-sm w-full text-center">
            <h2 class="text-2xl font-bold text-blue-600 mb-1">GAME OVER</h2>
            <p id="result-msg" class="text-gray-500 mb-4 text-sm font-bold"></p>
            <div class="bg-blue-50 p-4 rounded-2xl mb-5">
                <span class="text-gray-400 text-sm block">최종 점수</span>
                <span id="final-score" class="text-5xl font-bold text-blue-600">0</span>
            </div>
            <div id="rank-save-area" class="mb-4">
                <input type="text" id="player-name" maxlength="8" placeholder="이름을 입력하세요" class="w-full border-2 p-3 rounded-xl text-center font-bold mb-3 outline-none focus:border-green-500">
                <button onclick="saveToRanking()" id="save-btn" class="w-full bg-green-500 text-white p-3 rounded-xl font-bold active:scale-95 transition-transform">기록 저장</button>
            </div>
            <button onclick="location.reload()" class="w-full bg-gray-100 text-gray-500 p-3 rounded-xl font-bold">다시 하기</button>
        </div>
    </div>

    <!-- 랭킹 모달 -->
    <div id="ranking-modal" class="fixed inset-0 modal hidden flex items-center justify-center z-[60] p-4">
        <div class="bg-white text-gray-800 p-6 rounded-3xl max-w-sm w-full text-center">
            <h2 class="text-2xl font-bold text-yellow-600 mb-4">🏆 명예의 전당</h2>
            <div id="ranking-list" class="space-y-1 mb-5 max-h-60 overflow-y-auto border-y border-gray-100"></div>
            <button onclick="document.getElementById('ranking-modal').classList.add('hidden')" class="w-full bg-gray-600 text-white p-3 rounded-xl font-bold">닫기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const TILE_SIZE = 40; const GRID_SIZE = 10;
        canvas.width = TILE_SIZE * GRID_SIZE; canvas.height = TILE_SIZE * GRID_SIZE;

        let player = { x: 1, y: 1 }; let exit = { x: 8, y: 8 };
        let boxes = []; let map = []; let score = 0; let lives = 5;
        let timeLeft = 60; let maxTime = 60; let currentTopic = 1; let stage = 1;
        let timerId = null; let hasKey = false; let quizData = {};
        let moveInterval = null; let isPaused = true; let selectedBoxIndex = -1;

        const topicNames = { 1: "몇십", 2: "몇십몇", 3: "몫 1자리", 4: "몫 2자리" };

        function generateMap() {
            map = [];
            for(let y=0; y<GRID_SIZE; y++) {
                map[y] = [];
                for(let x=0; x<GRID_SIZE; x++) map[y][x] = (x === 0 || y === 0 || x === GRID_SIZE-1 || y === GRID_SIZE-1) ? 1 : (Math.random() < 0.15 ? 1 : 0);
            }
            player = { x: 1, y: 1 }; exit = { x: 8, y: 8 }; map[1][1] = 0; map[8][8] = 0;
            boxes = [];
            for (let i = 0; i < 2 + stage; i++) {
                let bx, by;
                do { bx = Math.floor(Math.random()*8)+1; by = Math.floor(Math.random()*8)+1; } 
                while (map[by][bx] === 1 || (bx === 1 && by === 1) || boxes.some(b => b.x === bx && b.y === by));
                boxes.push({ x: bx, y: by, solved: false });
            }
            hasKey = false; updateUI(); draw();
        }

        function updateUI() {
            document.getElementById('stage-display').innerText = stage;
            document.getElementById('score-display').innerText = score;
            const remaining = boxes.filter(b => !b.solved).length;
            document.getElementById('box-count-display').innerText = remaining;
            if (remaining === 0) hasKey = true;
            document.getElementById('lives-display').innerText = "❤️".repeat(Math.max(0, lives)) + "🤍".repeat(Math.max(0, 5-lives));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let y=0; y<GRID_SIZE; y++) {
                for(let x=0; x<GRID_SIZE; x++) {
                    if(map[y][x] === 1) { 
                        ctx.fillStyle = '#4a5568'; 
                        ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE-2, TILE_SIZE-2); 
                    }
                }
            }
            ctx.font = '28px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(hasKey ? '🔓' : '🔒', exit.x*TILE_SIZE + 20, exit.y*TILE_SIZE + 20);
            boxes.forEach(b => { if(!b.solved) ctx.fillText('📦', b.x*TILE_SIZE+20, b.y*TILE_SIZE+20); });
            ctx.fillText('🏃', player.x*TILE_SIZE+20, player.y*TILE_SIZE+20);
        }

        function processMove(dir) {
            if(isPaused) return;
            let nx = player.x, ny = player.y;
            if(dir === 'up') ny--; if(dir === 'down') ny++; if(dir === 'left') nx--; if(dir === 'right') nx++;
            if(nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && map[ny][nx] === 0) {
                player.x = nx; player.y = ny;
                const idx = boxes.findIndex(b => !b.solved && b.x === nx && b.y === ny);
                if(idx !== -1) { selectedBoxIndex = idx; openQuiz(); }
                if(hasKey && nx === exit.x && ny === exit.y) { stage++; score += 50; timeLeft = Math.min(maxTime, timeLeft + 20); generateMap(); }
                draw();
            }
        }

        function openQuiz() {
            stopContinuousMove(); isPaused = true;
            let n1, n2;
            if(currentTopic === 1) { n2 = (Math.floor(Math.random()*8)+2)*10; n1 = Math.floor(Math.random()*800)+100; }
            else if(currentTopic === 2) { n2 = Math.floor(Math.random()*80)+11; n1 = Math.floor(Math.random()*80)+11; if(n1 < n2) [n1, n2] = [n2, n1]; }
            else if(currentTopic === 3) { n2 = Math.floor(Math.random()*80)+11; n1 = n2 * (Math.floor(Math.random()*8)+1) + Math.floor(Math.random()*n2); }
            else { n2 = Math.floor(Math.random()*40)+11; n1 = n2 * (Math.floor(Math.random()*20)+10) + Math.floor(Math.random()*n2); }
            quizData = { n1, n2, q: Math.floor(n1/n2), r: n1%n2 };
            document.getElementById('q-n1').innerText = n1; document.getElementById('q-n2').innerText = n2;
            document.getElementById('ans-q').value = ''; document.getElementById('ans-r').value = '';
            document.getElementById('quiz-topic').innerText = "유형: " + topicNames[currentTopic];
            document.getElementById('quiz-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('ans-q').focus(), 300);
        }

        function submitAnswer() {
            const uq = parseInt(document.getElementById('ans-q').value);
            const ur = parseInt(document.getElementById('ans-r').value || 0);
            if(uq === quizData.q && ur === quizData.r) {
                boxes[selectedBoxIndex].solved = true; score += 20; isPaused = false;
                document.getElementById('quiz-modal').classList.add('hidden');
                updateUI(); draw();
            } else {
                lives--; updateUI();
                document.getElementById('quiz-feedback').innerText = "오답입니다! (목숨 -1)";
                if(lives <= 0) endGame("목숨을 모두 잃었습니다.");
                else setTimeout(() => { isPaused = false; document.getElementById('quiz-modal').classList.add('hidden'); document.getElementById('quiz-feedback').innerText = ""; draw(); }, 1200);
            }
        }

        function initGame(topic) {
            currentTopic = topic; score = 0; stage = 1; lives = 5; 
            maxTime = (topic === 4 ? 120 : 70); timeLeft = maxTime;
            isPaused = false; document.getElementById('start-modal').classList.add('hidden');
            generateMap();
            if(timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                if(isPaused) return;
                timeLeft--; 
                document.getElementById('timer-text').innerText = timeLeft;
                document.getElementById('timer-bar').style.width = (timeLeft / maxTime * 100) + "%";
                if(timeLeft <= 0) endGame("시간이 초과되었습니다!");
            }, 1000);
        }

        function endGame(msg) { clearInterval(timerId); isPaused = true; document.getElementById('result-modal').classList.remove('hidden'); document.getElementById('result-msg').innerText = msg; document.getElementById('final-score').innerText = score; }

        async function saveToRanking() {
            const name = document.getElementById('player-name').value.trim();
            if(!name) return alert("이름을 입력해주세요!");
            if(!window.gameDB.auth.currentUser) return alert("서버 연결 중...");
            document.getElementById('save-btn').disabled = true;
            try {
                await window.gameDB.addDoc(window.gameDB.collection(window.gameDB.db, 'escape_rankings'), { name, score, topic: topicNames[currentTopic], date: new Date().toISOString() });
                document.getElementById('rank-save-area').innerHTML = "<p class='text-green-500 font-bold'>기록 저장 완료!</p>";
                setTimeout(showRanking, 1000);
            } catch(e) { alert("저장 실패"); document.getElementById('save-btn').disabled = false; }
        }

        function startContinuousMove(dir) { 
            if(isPaused) return;
            processMove(dir); 
            clearInterval(moveInterval);
            moveInterval = setInterval(() => processMove(dir), 150); 
        }
        function stopContinuousMove() { clearInterval(moveInterval); }
        window.addEventListener('keydown', e => { if(e.key.includes('Arrow')) { e.preventDefault(); processMove(e.key.replace('Arrow','').toLowerCase()); } });
    </script>
</body>
</html>
